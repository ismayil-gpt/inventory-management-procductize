<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mizan">
  <title>Mizan mark (monochrome — uses currentColor)</title>
  <!-- Single colour: the three faces are told apart by tint, the barcode is cut out of the side. -->
  <rect x="4" y="4" width="112" height="112" rx="30" fill="none" stroke="currentColor" stroke-width="6"/>
  <g stroke-width="2.5" stroke-linejoin="round" fill="currentColor" stroke="currentColor">
    <polygon points="27,40 60,58.86 60,98.86 27,80"/>
    <polygon points="60,58.86 93,40 93,80 60,98.86" opacity=".8"/>
    <polygon points="60,21.14 93,40 60,58.86 27,40" opacity=".55"/>
  </g>
  <g transform="matrix(1 -0.5714 0 1 60 58.86)" fill="#FFFFFF"><rect x="6" y="9" width="4" height="24"/><rect x="13" y="9" width="3" height="24"/><rect x="19" y="9" width="5" height="24"/><rect x="27" y="9" width="3" height="24"/></g>
</svg>
