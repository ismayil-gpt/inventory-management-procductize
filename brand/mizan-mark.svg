<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mizan">
  <title>Mizan mark</title>
  <!-- The scannable carton: a navy carton, lit from above, with a barcode on its side, on a sign-yellow tile. -->
  <rect width="120" height="120" rx="32" fill="#F4C64A"/>
  <g stroke-width="2.5" stroke-linejoin="round">
    <polygon points="27,40 60,58.86 60,98.86 27,80" fill="#2A3A52" stroke="#2A3A52"/>
    <polygon points="60,58.86 93,40 93,80 60,98.86" fill="#1F2C40" stroke="#1F2C40"/>
    <polygon points="60,21.14 93,40 60,58.86 27,40" fill="#3B4F6E" stroke="#3B4F6E"/>
  </g>
  <g transform="matrix(1 -0.5714 0 1 60 58.86)" fill="#F4C64A"><rect x="6" y="9" width="4" height="24"/><rect x="13" y="9" width="3" height="24"/><rect x="19" y="9" width="5" height="24"/><rect x="27" y="9" width="3" height="24"/></g>
</svg>
