# =============================================================================
# Mizan — production (on-premise server with GPU). Ref: CLAUDE.md §2, §11.
# Same images and code as development; only configuration differs.
#
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d
#
# Networks (DESC #11, §1):
#   public  — nginx only; the one place ports are published (80, 443)
#   edge    — internal: nginx ↔ frontend, backend
#   data    — internal: backend, ai-service, ollama, postgres, migrate, backup.
#             No route to the internet: the AI cannot call out even by mistake.
#   mail    — backend only, for SMTP to the organisation's relay (the one
#             permitted outbound connection). Restrict it to the relay's address
#             at the host firewall.
#
# Data (DESC #2): every volume is a directory under MIZAN_DATA_DIRECTORY, which
# must sit on an encrypted (LUKS) filesystem. scripts/check-production-host.sh
# refuses to continue if it does not.
#
# Not included on purpose: Redis and MinIO. Nothing in the code uses them —
# sessions live in PostgreSQL and PDFs are generated on demand (OPEN-QUESTIONS #23).
# =============================================================================

name: mizan-production

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  nginx:
    <<: *hardening
    image: nginx:1.27-alpine
    depends_on:
      frontend: { condition: service_started }
      backend: { condition: service_healthy }
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.production.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
      - ${TLS_CERTIFICATE_DIRECTORY:?set TLS_CERTIFICATE_DIRECTORY}:/etc/nginx/tls:ro
    networks: [public, edge]

  frontend:
    <<: *hardening
    image: mizan/frontend:${MIZAN_VERSION:-latest}
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx"]
    cap_drop: [ALL]
    expose: ["8080"]
    networks: [edge]

  migrate:
    # One-shot: applies schema migrations, the append-only rules and the
    # post-migration privileges as the schema owner, then exits (DESC #10, #19).
    image: mizan/backend:${MIZAN_VERSION:-latest}
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    command: ["sh", "./migrate.sh"]
    environment:
      DATABASE_URL: postgresql://mizan_owner:${MIZAN_OWNER_PASSWORD:?}@postgres:5432/mizan_inventory
    depends_on:
      postgres: { condition: service_healthy }
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [data]

  backend:
    <<: *hardening
    image: mizan/backend:${MIZAN_VERSION:-latest}
    env_file: [.env.production]
    environment:
      NODE_ENV: production
      # Runtime role: rows only, no DDL, no UPDATE/DELETE on audit or movements (DESC #19).
      DATABASE_URL: postgresql://mizan_app:${MIZAN_APP_PASSWORD:?}@postgres:5432/mizan_inventory
      AI_SERVICE_URL: http://ai-service:8000
      TRUST_PROXY: "1"
      SWAGGER_ENABLED: "false"
    depends_on:
      migrate: { condition: service_completed_successfully }
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    expose: ["3000"]
    networks: [edge, data, mail]

  ai-service:
    <<: *hardening
    image: mizan/ai-service:${MIZAN_VERSION:-latest}
    build:
      context: .
      dockerfile: infrastructure/docker/ai-service.Dockerfile
    env_file: [.env.production]
    environment:
      BACKEND_BASE_URL: http://backend:3000/api/v1
      OLLAMA_URL: http://ollama:11434
      LANGUAGE_MODEL_PROFILE: qwen-production
    depends_on:
      ollama: { condition: service_started }
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    expose: ["8000"]
    networks: [data]

  ollama:
    <<: *hardening
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    # Models are loaded once at installation (see the production guide); at
    # runtime Ollama has no internet access.
    volumes:
      - ${MIZAN_DATA_DIRECTORY:?set MIZAN_DATA_DIRECTORY}/ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    expose: ["11434"]
    networks: [data]

  postgres:
    <<: *hardening
    image: postgres:16-alpine
    environment:
      # Superuser for first-time initialisation only; the app never uses it.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
      POSTGRES_DB: mizan_inventory
      MIZAN_OWNER_PASSWORD: ${MIZAN_OWNER_PASSWORD:?}
      MIZAN_APP_PASSWORD: ${MIZAN_APP_PASSWORD:?}
      MIZAN_BACKUP_PASSWORD: ${MIZAN_BACKUP_PASSWORD:?}
    volumes:
      - ${MIZAN_DATA_DIRECTORY:?}/postgres:/var/lib/postgresql/data
      - ./database/production/01-create-least-privilege-roles.sh:/docker-entrypoint-initdb.d/01-create-least-privilege-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mizan_inventory"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose: ["5432"]
    networks: [data]

  backup:
    # DESC #17 — daily encrypted backup at BACKUP_TIME (default 02:00 local),
    # read-only database role, key file mounted read-only.
    <<: *hardening
    image: mizan/backup:${MIZAN_VERSION:-latest}
    build:
      context: .
      dockerfile: infrastructure/docker/backup.Dockerfile
    environment:
      DATABASE_URL: postgresql://mizan_backup:${MIZAN_BACKUP_PASSWORD:?}@postgres:5432/mizan_inventory
      BACKUP_DIRECTORY: /backups
      BACKUP_ENCRYPTION_KEY_FILE: /run/mizan/backup-encryption.key
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
      TZ: Asia/Dubai
    volumes:
      - ./scripts:/mizan/scripts:ro
      - ${MIZAN_DATA_DIRECTORY:?}/backups:/backups
      - ${BACKUP_ENCRYPTION_KEY_FILE:?set BACKUP_ENCRYPTION_KEY_FILE}:/run/mizan/backup-encryption.key:ro
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data]

networks:
  public:
    driver: bridge
  edge:
    driver: bridge
    internal: true
  data:
    driver: bridge
    internal: true
    # Fixed subnet so MFA_EXEMPT_NETWORKS can name exactly this network (the AI
    # service signs in from here; no other network reaches the API's sign-in).
    ipam:
      config:
        - subnet: ${MIZAN_DATA_SUBNET:-10.88.0.0/24}
  mail:
    driver: bridge
