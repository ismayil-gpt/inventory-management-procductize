# Mizan — reverse proxy, production. Ref: CLAUDE.md §2, §11.1 #1, #11, #13.
# The ONLY service published to the host. Terminates TLS with the organisation's
# certificate and forwards to the frontend and API on the internal network.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # Excel import (§5A.4) uploads can be a few MB.
    client_max_body_size 20m;

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # DESC #1 — encryption in transit. The organisation's certificate, mounted
        # read-only from TLS_CERTIFICATE_DIRECTORY (see the production guide).
        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache   shared:MizanTLS:10m;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        # DESC #13 — the app's Content-Security-Policy and other headers (single source).
        include /etc/nginx/security-headers.conf;

        # The API docs page is a development aid; it is off in the backend too.
        location /api/v1/docs {
            return 404;
        }

        # Backend keeps its own /api/v1 prefix. TRUST_PROXY=1 in the backend reads
        # the client address from X-Forwarded-For (rate limiting, audit log).
        location /api/ {
            proxy_pass http://backend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ai-service and the database are not routable from here (DESC #11).

        location / {
            proxy_pass http://frontend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
