# DESC #13 — security headers for the web application, included by the nginx
# site configuration. This file is the single source of the app's
# Content-Security-Policy: frontend/vite.config.ts reads the same line for
# `vite preview`, so the policy is tested exactly as it will be served.
#
#   script-src 'self'        only Mizan's own bundled scripts; no inline code, no eval
#   style-src  'self'        only the bundled stylesheet (React style props use CSSOM, which CSP allows)
#   img-src    data: blob:   barcode labels and QR codes are data: images; PDFs open as blob: URLs
#   connect-src 'self'       the API is same-origin through nginx; nothing else is ever called (§1)
#   frame-ancestors 'none'   Mizan cannot be framed (clickjacking)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; worker-src 'self'; manifest-src 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
