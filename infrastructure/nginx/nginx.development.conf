# Mizan — reverse proxy, development environment. Ref: CLAUDE.md §2, §11.1 #1, #11.
# This is the ONLY service published to the host (network segmentation, DESC #11).
# Frontend and backend are served under one origin here, which is what keeps the
# app CORS-free — including when reached over Tailscale from another device.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Excel import (§5A.4) uploads can be a few MB.
    client_max_body_size 20m;

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        # Self-signed for development (DESC #1 — implemented, not production-grade;
        # see §11.2). Regenerate with the Tailscale hostname as CN/SAN if the browser
        # warning becomes a nuisance on other devices.
        ssl_certificate     /etc/nginx/certs/dev-cert.pem;
        ssl_certificate_key /etc/nginx/certs/dev-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=63072000" always;

        # Backend keeps its own /api/v1 prefix — proxy_pass has no path component
        # after the port, so the full request URI is forwarded unchanged.
        location /api/ {
            proxy_pass http://backend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ai-service is deliberately NOT reachable through here — internal only,
        # backend-to-ai-service on the Docker network (§7, DESC #11).

        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
