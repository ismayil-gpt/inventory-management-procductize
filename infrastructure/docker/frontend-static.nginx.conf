# Static file server for the built React app, inside the frontend container.
# SPA fallback so client-side routes (React Router, §4) survive a hard refresh.
# The reverse-proxy nginx (infrastructure/nginx/) is what's actually published
# to the host — this one is only reachable on the internal Docker network.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|woff2?|ttf|png|jpg|jpeg)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}
